# LiteSpeed / Apache-compatible redirect map for Grow Green Weed Control
# Install on the edge (or document root) IN ADDITION to the Node app redirects.
# Preserve query strings (UTM, fbclid) — RewriteRule flags below keep them.
#
# If using a reverse proxy to Node, these can live on the LiteSpeed vhost before the proxy.
# Test with: curl -I https://growgreenweedcontrol.com/about/

RewriteEngine On

# Legacy aliases → canonical paths (301)
RewriteRule ^about/?$ /about-us/ [R=301,L,QSA]
RewriteRule ^contact/?$ /contact-us/ [R=301,L,QSA]
RewriteRule ^privacy/?$ /privacy-policy/ [R=301,L,QSA]
RewriteRule ^request-/?$ /request-a-quote/ [R=301,L,QSA]
RewriteRule ^flower-bed-weed-control/?$ /flower-bed-weed-control-and-fertilization/ [R=301,L,QSA]
RewriteRule ^pre-emergent-weed-control/?$ /lawn-fertilization-weed-control/ [R=301,L,QSA]
RewriteRule ^lawn-treatment-denham-springs/?$ /service-areas/denham-springs/ [R=301,L,QSA]
RewriteRule ^services/core-aeration/?$ /core-aeration/ [R=301,L,QSA]
RewriteRule ^services/fire-ant-treatment/?$ /fire-ant-treatment/ [R=301,L,QSA]
RewriteRule ^services/flower-bed-weed-control/?$ /flower-bed-weed-control-and-fertilization/ [R=301,L,QSA]
RewriteRule ^services/lawn-fertilization-weed-control/?$ /lawn-fertilization-weed-control/ [R=301,L,QSA]

# Case typo from Search Console / old links
RewriteRule ^the-ultimate-guide-to-fertilizing-your-lawn-in-south-Louisiana/?$ /the-ultimate-guide-to-fertilizing-your-lawn-in-south-louisiana/ [R=301,L,QSA]
